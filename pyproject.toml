[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lobrep"
version = "0.1.0"
description = "Self-supervised representation learning for limit-order-book regime detection and volatility prediction"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn>=1.3", "torch", "matplotlib"]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn", "httpx"]
track = ["mlflow"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
